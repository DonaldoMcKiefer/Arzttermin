spring.application.name=terminfinder
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/arzttermin}
spring.datasource.username=${DB_USER:arzttermin}
spring.datasource.password=${DB_PASSWORD:arzttermin}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Berlin
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

vaadin.allowed-packages=com.vaadin,org.vaadin,com.kiefer.arzttermin
vaadin.launch-browser=false

terminradar.demo-data-enabled=${DEMO_DATA_ENABLED:true}
terminradar.offer-validity-minutes=${OFFER_VALIDITY_MINUTES:30}

logging.level.org.atmosphere=warn

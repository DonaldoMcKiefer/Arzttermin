services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arzttermin
      POSTGRES_USER: arzttermin
      POSTGRES_PASSWORD: arzttermin
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arzttermin -d arzttermin"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - arzttermin-postgres:/var/lib/postgresql/data

volumes:
  arzttermin-postgres:
